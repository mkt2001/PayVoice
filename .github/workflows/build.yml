name: Build Payvoice APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -o Payvoice_GitHub_Project.zip -d extracted
          find extracted -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
          test -n "$PROJECT_DIR"
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug
          find extracted -path '*/build/outputs/apk/debug/*.apk'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Payvoice-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
