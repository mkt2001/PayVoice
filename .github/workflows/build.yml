
name: Build Payvoice APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Prepare Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: unzip -o Payvoice_GitHub_Project.zip

      - name: Build APK
        run: gradle --no-daemon -p payvoice_project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Payvoice-debug-apk
          path: payvoice_project/app/build/outputs/apk/debug/app-debug.apk
          
