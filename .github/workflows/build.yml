
name: Build Payvoice APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -o Payvoice_GitHub_Project.zip -d extracted
          find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \)

      - name: Build APK
        run: |
          PROJECT_FILE=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          test -n "$PROJECT_FILE"
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug
          find extracted -type f -name '*.apk'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Payvoice-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
