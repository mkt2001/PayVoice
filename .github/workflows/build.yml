name: Build Payvoice APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Payvoice project
        run: |
          mkdir -p extracted
          unzip -o Payvoice_GitHub_Project.zip -d extracted
          echo "Project files:"
          find extracted -type f | head -100

      - name: Find Android project
        id: project
        run: |
          SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Align Java and Kotlin targets
        run: |
          python3 - "${{ steps.project.outputs.dir }}/app/build.gradle" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          if not p.exists():
              print("app/build.gradle not found; leaving configuration unchanged")
              sys.exit(0)

          s = p.read_text()
          s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
          s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
          s = s.replace("jvmTarget = '1.8'", "jvmTarget = '17'")
          p.write_text(s)
          print("Checked:", p)
          PY

      - name: Build debug APK
        run: |
          gradle --no-daemon -p "${{ steps.project.outputs.dir }}" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Payvoice-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
